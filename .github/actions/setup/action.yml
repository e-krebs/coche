name: Setup
description: nub (pinned), the Node it provisions, installed dependencies, and optionally Playwright's Chromium.

inputs:
  playwright:
    description: Provision the Chromium build Playwright needs. Only the e2e tiers want this.
    default: "false"
  needs-apt:
    description: >
      Reinstall Chromium's system libraries even on a browser-cache hit. The ubuntu-latest image
      already carries them, so this stays off; flip it if a runner image drops one and Chromium
      fails to launch.
    default: "false"

runs:
  using: composite
  steps:
    # Installed from nubjs.com's script pinned to an exact version, not nubjs/setup-nub: that action
    # would run inside jobs holding CLERK_SECRET_KEY and the Cloudflare deploy credentials, and a SHA
    # pin guards against a moved tag, not against the code at that SHA. The installer verifies the
    # release archive against its published SHA-256 sidecar. NUB_NO_MODIFY_PATH keeps it out of the
    # shell profile; the PATH entry below is explicit instead.
    - name: Install nub
      shell: bash
      env:
        NUB_VERSION: 0.7.5
        NUB_NO_MODIFY_PATH: "1"
      run: |
        curl -fsSL https://nubjs.com/install.sh | bash -s "$NUB_VERSION"
        echo "$HOME/.nub/bin" >> "$GITHUB_PATH"
    # nub provisions the Node named in .node-version, so no actions/setup-node: the pin is one file
    # shared by CI and every developer rather than a node-version input that can drift from it.
    # Cached together with the package store — both live under the same two directories.
    - name: Restore the nub store and Node toolchain
      uses: actions/cache@v4
      with:
        path: |
          ~/.local/share/nub/store
          ~/.cache/nub
        key: nub-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '.node-version') }}
        restore-keys: nub-${{ runner.os }}-
    - run: nub ci
      shell: bash
    # Read the version from the installed package rather than the lockfile: it keys the browser cache
    # below, and a browser build belongs to a Playwright version, not to the whole dependency set.
    - name: Resolve the Playwright version
      if: inputs.playwright == 'true'
      id: playwright
      shell: bash
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
    # Exact-match only (no restore-keys): a partial hit would hand Playwright a browser build it
    # refuses to launch, which is slower to debug than the download it saved.
    - name: Restore the Playwright browser cache
      if: inputs.playwright == 'true'
      id: browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    - name: Install Chromium
      if: inputs.playwright == 'true' && steps.browsers.outputs.cache-hit != 'true'
      shell: bash
      run: nubx playwright install --with-deps chromium
    # Deliberately not run on a cache hit: `install-deps` is apt, and apt cost 38s here — more than
    # the browser download the cache saved. The runner image already ships Chromium's libraries.
    - name: Install Chromium's system dependencies
      if: inputs.playwright == 'true' && steps.browsers.outputs.cache-hit == 'true' && inputs.needs-apt == 'true'
      shell: bash
      run: nubx playwright install-deps chromium
